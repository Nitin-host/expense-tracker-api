<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Expense - Expense Tracker</title>
    <style>
        .container {
            max-width: 500px;
            margin: 30px auto;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f7f6;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.09);
            color: #0f172a;
        }

        .header h2 {
            color: #0f766e;
            margin: 0 0 16px;
        }

        .content {
            font-size: 1.05em;
            line-height: 1.6;
        }

        .details {
            background: #ecfdf5;
            border-left: 4px solid #0f766e;
            padding: 16px 20px;
            margin: 18px 0;
            list-style: none;
        }

        .details li {
            margin: 6px 0;
        }

        .button {
            display: inline-block;
            padding: 12px 28px;
            background: #0f766e;
            color: #fff !important;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.05em;
        }

        .footer {
            margin-top: 24px;
            color: #64748b;
            font-size: 0.95em;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>New expense added</h2>
        </div>
        <div class="content">
            <p><strong>{{addedBy}}</strong> added an expense to <strong>{{solutionName}}</strong>.</p>
            <ul class="details">
                <li><strong>Name:</strong> {{expenseName}}</li>
                <li><strong>Category:</strong> {{category}}</li>
                <li><strong>Amount:</strong> ₹{{amount}}</li>
            </ul>
            <p style="text-align:center;">
                <a href="{{expenseLink}}" class="button">View expenses</a>
            </p>
        </div>
        <div class="footer">
            &mdash; Expense Tracker
        </div>
    </div>
</body>

</html>
